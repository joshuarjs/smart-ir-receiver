<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="380" rx="14" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1d1f22">Smart IR Receiver wiring (ESP32-C6 SuperMini)</text>
  <text x="24" y="54" font-size="12.5" fill="#5f646b">Schematic only: match the pins by the labels printed on the board, not by position.</text>

  <!-- board -->
  <rect x="300" y="80" width="170" height="250" rx="10" fill="#1f2a44" stroke="#0f1626" stroke-width="2"/>
  <rect x="352" y="62" width="66" height="26" rx="5" fill="#9aa3ad" stroke="#59616b"/>
  <text x="385" y="79" font-size="11" text-anchor="middle" fill="#1d1f22">USB-C</text>
  <text x="385" y="118" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">ESP32-C6</text>
  <text x="385" y="135" font-size="12" text-anchor="middle" fill="#c9d1dc">SuperMini</text>
  <g font-size="12.5" fill="#ffffff">
    <circle cx="300" cy="175" r="6" fill="#e8c46a" stroke="#8a6d1f"/><text x="312" y="179">3V3</text>
    <circle cx="300" cy="215" r="6" fill="#e8c46a" stroke="#8a6d1f"/><text x="312" y="219">GND</text>
    <circle cx="300" cy="255" r="6" fill="#e8c46a" stroke="#8a6d1f"/><text x="312" y="259">GPIO 20</text>
    <circle cx="470" cy="215" r="6" fill="#e8c46a" stroke="#8a6d1f"/><text x="458" y="219" text-anchor="end">GND</text>
    <circle cx="470" cy="255" r="6" fill="#e8c46a" stroke="#8a6d1f"/><text x="458" y="259" text-anchor="end">GPIO 5</text>
  </g>
  <g font-size="11" fill="#c9d1dc">
    <circle cx="322" cy="300" r="5" fill="#ffd166"/><text x="331" y="304">LED 15</text>
    <rect x="392" y="294" width="11" height="11" rx="2" fill="#ffffff" opacity=".55"/><text x="408" y="304">RGB 8 (off)</text>
  </g>

  <!-- IR receiver -->
  <rect x="40" y="150" width="130" height="130" rx="10" fill="#f3f4f6" stroke="#9aa1aa"/>
  <path d="M72 150 a33 33 0 0 1 66 0" fill="#2b2f36"/>
  <text x="105" y="196" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1f22">IR receiver</text>
  <text x="105" y="300" font-size="11" text-anchor="middle" fill="#5f646b">VS1838B / TSOP38238 type</text>
  <g font-size="12" fill="#1d1f22">
    <circle cx="170" cy="175" r="5" fill="#9aa1aa"/><text x="160" y="179" text-anchor="end">VCC</text>
    <circle cx="170" cy="215" r="5" fill="#9aa1aa"/><text x="160" y="219" text-anchor="end">GND</text>
    <circle cx="170" cy="255" r="5" fill="#9aa1aa"/><text x="160" y="259" text-anchor="end">OUT</text>
  </g>
  <line x1="175" y1="175" x2="294" y2="175" stroke="#d1495b" stroke-width="3"/>
  <line x1="175" y1="215" x2="294" y2="215" stroke="#1d1f22" stroke-width="3"/>
  <line x1="175" y1="255" x2="294" y2="255" stroke="#2a9d8f" stroke-width="3"/>
  <text x="234" y="168" font-size="11" text-anchor="middle" fill="#d1495b">3.3 V</text>
  <text x="234" y="248" font-size="11" text-anchor="middle" fill="#2a9d8f">signal</text>

  <!-- button -->
  <rect x="600" y="190" width="120" height="90" rx="10" fill="#f3f4f6" stroke="#9aa1aa"/>
  <rect x="640" y="215" width="40" height="40" rx="6" fill="#2b2f36"/><circle cx="660" cy="235" r="11" fill="#5f646b"/>
  <text x="660" y="300" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1f22">Hotspot button</text>
  <text x="660" y="316" font-size="11" text-anchor="middle" fill="#5f646b">optional, hold 2 s</text>
  <polyline points="476,215 560,215 560,225 600,225" fill="none" stroke="#1d1f22" stroke-width="3"/>
  <polyline points="476,255 560,255 560,245 600,245" fill="none" stroke="#e76f51" stroke-width="3"/>
  <text x="520" y="272" font-size="11" text-anchor="middle" fill="#e76f51">internal pull-up</text>

  <text x="24" y="360" font-size="12" fill="#5f646b">IR receiver modules differ in pin order. Check the markings on yours (OUT / GND / VCC, or S / - / +).</text>
</svg>
