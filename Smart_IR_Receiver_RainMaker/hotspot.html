<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart IR Receiver Wi-Fi setup</title>
<style>
:root{color-scheme:dark;--bg:#0c0c0e;--panel:#141518;--field:#0c0c0e;--tx:#e6e7ea;--mut:#8a8d95;--line:#2c2e33;--line2:#1f2125;--vfd:#5ff3e6;--amber:#ffb547;--bad:#ff8a7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px))}
main{max-width:460px;margin:0 auto}
.face{border-radius:10px;padding:14px 16px;margin:0 0 12px;border:1px solid #3a3c42;background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),linear-gradient(180deg,#2b2c30,#141518);box-shadow:inset 0 1px 0 #4a4d55,0 3px 0 #000}
h1{margin:0 0 10px;font-size:14px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#c9cbd0}
.vfd{min-height:62px;border-radius:6px;background:#030605;border:1px solid #000;box-shadow:inset 0 3px 10px #000;padding:9px 14px;font-family:ui-monospace,Consolas,Menlo,monospace;color:var(--amber);text-shadow:0 0 6px rgba(255,181,71,.6);font-size:14px;letter-spacing:.04em}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;background:var(--panel)}
.card h2{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin:0 0 8px;padding:0 0 8px;border-bottom:1px solid var(--line2)}
p{margin:0 0 8px;font-size:14px;color:var(--mut)}p b{color:var(--tx);font-weight:600}
.lh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin:8px 0 4px;min-height:24px}
.nets{height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.net{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:0 12px;background:none;border:0;border-radius:0;box-shadow:none;border-bottom:1px solid var(--line2);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.net:last-child{border-bottom:0}.net[aria-selected=true]{background:#0b2724;color:var(--vfd)}
.net span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.net span:last-child{flex:none;color:var(--mut);font-size:13px}
.empty{padding:12px;color:var(--mut);font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input{width:100%;height:44px;font:inherit;color:var(--tx);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:0 10px}
.pw{display:flex;gap:8px}.pw input{flex:1}
button{font:inherit;font-weight:600;color:#1b1c1f;background:linear-gradient(180deg,#d8d9dc,#9c9ea3);border:1px solid #6c6f76;border-radius:22px;min-height:44px;padding:0 16px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button.p{width:100%;margin-top:14px;background:var(--vfd);border-color:var(--vfd);color:#062421;letter-spacing:.06em}
.lnk{background:none;border:0;color:var(--vfd);min-height:24px;padding:0;font-size:13px;font-weight:400;text-decoration:underline}
.st{min-height:84px;margin-top:12px;font-size:14px;line-height:20px;color:var(--mut)}.st.bad{color:var(--bad)}.st.ok{color:var(--vfd)}
:focus-visible{outline:2px solid var(--vfd);outline-offset:2px}
</style></head><body><main>
<section class="face"><h1>Smart IR Receiver</h1><div class="vfd" id="why" role="status">Wi-Fi setup hotspot</div></section>
<section class="card"><h2>About this hotspot</h2>
<p id="info">—</p></section>
<section class="card"><h2>Join a network</h2>
<div class="lh"><span>Networks nearby</span><button class="lnk" id="scan">Scan again</button></div>
<div class="nets" id="nets" role="listbox" aria-label="Networks nearby"><div class="empty">Scanning…</div></div>
<label for="ssid">Network name</label><input id="ssid" maxlength="32" autocomplete="off" spellcheck="false">
<label for="pass">Password</label><div class="pw"><input id="pass" type="password" maxlength="63" autocomplete="off"><button id="show" aria-pressed="false">Show</button></div>
<button class="p" id="go">Connect</button>
<div class="st" id="st" role="status"></div></section>
</main><script>
const $=id=>document.getElementById(id);let busy=false;
function st(t,c){$('st').textContent=t;$('st').className='st'+(c?' '+c:'');}
function bars(r){return r>-60?'●●●●':r>-70?'●●●○':r>-80?'●●○○':'●○○○';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
async function info(){try{const j=await (await fetch('/api/hotspot',{cache:'no-store'})).json();
 if(j.manual){$('why').textContent='HOTSPOT OPEN · BUTTON';
  $('info').innerHTML='You opened this hotspot with the button on the receiver. '+(j.online?'It is still on <b>'+esc(j.ssid)+'</b>, so remote buttons keep working. ':'')+'Pick a network below to move it. The hotspot closes 10 minutes after you leave it.';}
 else{$('why').textContent='NO WI-FI · '+(j.ssid||'saved network').toUpperCase();
  $('info').innerHTML='The receiver couldn\u2019t connect to <b>'+esc(j.ssid||'its saved network')+'</b> for '+j.mins+' minutes, so it opened this hotspot. It keeps retrying in the background and closes this hotspot once it\u2019s back on.';}
 if(j.wt==1){busy=true;$('go').disabled=true;st('Trying '+j.wtSsid+'…','');}
 else if(busy&&j.wt==3){busy=false;$('go').disabled=false;st('Couldn\u2019t connect to '+j.wtSsid+': '+j.wtMsg+'. Check the password and try again.','bad');}
 else if(busy&&j.wt==2){busy=false;st('Connected to '+j.wtSsid+' and saved. This hotspot closes in a few seconds. Put your phone back on '+j.wtSsid+' and open http://'+j.mdns+'.local.','ok');}
}catch(e){}setTimeout(info,1500);}
async function scan(){const n=$('nets');n.innerHTML='<div class="empty">Scanning…</div>';
 for(let i=0;i<10;i++){try{const j=await (await fetch('/api/wifi/scan',{cache:'no-store'})).json();if(j.nets){
  n.innerHTML=j.nets.length?j.nets.map(x=>'<button class="net" role="option" aria-selected="false" data-s="'+esc(x.ssid)+'"><span>'+esc(x.ssid)+'</span><span>'+(x.open?'open · ':'')+bars(x.rssi)+'</span></button>').join(''):'<div class="empty">No networks found.</div>';
  n.querySelectorAll('.net').forEach(b=>b.onclick=()=>{n.querySelectorAll('.net').forEach(o=>o.setAttribute('aria-selected','false'));b.setAttribute('aria-selected','true');$('ssid').value=b.dataset.s;$('pass').focus();});return;}}catch(e){}
  await new Promise(r=>setTimeout(r,1000));}
 n.innerHTML='<div class="empty">Scan failed. Try again.</div>';}
$('scan').onclick=scan;
$('show').onclick=()=>{const p=$('pass'),v=p.type=='password';p.type=v?'text':'password';$('show').textContent=v?'Hide':'Show';$('show').setAttribute('aria-pressed',v);};
$('go').onclick=async()=>{const s=$('ssid').value.trim();if(!s){st('Pick or type a network name.','bad');return;}
 busy=true;$('go').disabled=true;st('Trying '+s+'… your phone may drop off this hotspot for a moment. If it does, rejoin it to see the result.','');
 try{await fetch('/api/wifi',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'ssid='+encodeURIComponent(s)+'&pass='+encodeURIComponent($('pass').value)});}catch(e){}};
info();scan();
</script></body></html>
